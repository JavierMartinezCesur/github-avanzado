name: CI Develop

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

  push:
    branches:
      - develop

  workflow_dispatch:

permissions:
  contents: write

jobs:

  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Mostrar rama
        run: |
          echo "Rama del evento: ${{ github.head_ref || github.ref_name }}"

      - name: Actualizar README
        run: |
          echo "Añadida feature: ${{ github.head_ref || github.ref_name }}" >> README.md

      - name: Mostrar README actualizado
        run: |
          cat README.md


  validate-dev:
    needs: update-readme
    runs-on: self-hosted

    steps:
      - name: Validar DEV_TOKEN
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}

        run: |
          if ($env:DEV_TOKEN -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "Los token coinciden"
          }
          else {
            Write-Host "Los tokens NO coinciden"
            exit 1
          }