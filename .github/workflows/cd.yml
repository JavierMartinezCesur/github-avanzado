name: CD Main

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:

  update-version:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Incrementar versión
        shell: bash
        run: |
          CURRENT=$(grep -oP 'AppVersion-\K[0-9]+' README.md | head -1)
          NEXT=$((CURRENT + 1))

          sed -i "s/AppVersion-$CURRENT/AppVersion-$NEXT/" README.md

          echo "Fecha actualización: $(date '+%Y-%m-%d %H:%M:%S')" >> README.md

          echo "Nueva versión: AppVersion-$NEXT"

      - name: Mostrar README
        run: cat README.md


  validate-prod:
    needs: update-version
    runs-on: self-hosted

    steps:
      - name: Validar PROD_TOKEN
        shell: powershell
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}

        run: |
          if ($env:PROD_TOKEN -eq $env:LOCAL_PROD_TOKEN) {
            Write-Host "Los tokens coinciden"
          }
          else {
            Write-Host "Los tokens NO coinciden"
            exit 1
          }